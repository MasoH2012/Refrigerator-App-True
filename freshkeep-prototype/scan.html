<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan Food</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><main class="scan-screen"><img class="camera-bg" src="https://images.unsplash.com/photo-1584306670957-acf935f5033c?auto=format&fit=crop&w=900&q=85" alt="Groceries ready to scan"><div class="scan-shade"></div><div class="statusbar"><span>9:41</span><span class="dynamic-island"></span><span class="status-icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div><header class="scan-top"><button class="icon-button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button><h1>Scan item</h1><button class="icon-button" aria-label="Flash"><i class="fa-solid fa-bolt"></i></button></header><div class="viewfinder" aria-label="Camera scan area"></div><section class="scan-bottom"><p>Center the item and expiration label in the frame</p><button class="shutter" aria-label="Take photo"></button><button style="margin-top:20px;border:0;background:transparent;color:white;font-weight:700">Enter manually instead</button></section></main></body></html>
