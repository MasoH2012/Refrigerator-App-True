<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreshKeep — High-Fidelity Prototype</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#17352b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1{margin:0;padding:48px 48px 12px;font-size:32px;letter-spacing:-.04em}.board{display:flex;gap:34px;align-items:flex-start;overflow-x:auto;padding:20px 48px 60px}.shot{flex:0 0 auto}.shot h2{margin:0 0 12px 4px;font-size:14px;font-weight:650;color:#5d6b65}.device{width:413px;height:872px;padding:10px;border-radius:50px;background:#101312;box-shadow:0 18px 45px rgba(20,45,36,.18)}iframe{display:block;width:393px;height:852px;border:0;border-radius:41px;background:#f7f9f7;overflow:hidden}@media(max-width:600px){h1{padding:28px 20px 8px}.board{padding:16px 20px 40px;gap:22px}}
  </style>
</head>
<body>
  <h1>FreshKeep</h1>
  <main class="board">
    <section class="shot"><h2>Home & inventory</h2><div class="device"><iframe src="home.html" title="Home screen"></iframe></div></section>
    <section class="shot"><h2>Expiring soon</h2><div class="device"><iframe src="expiring.html" title="Expiring items alert"></iframe></div></section>
    <section class="shot"><h2>Add item</h2><div class="device"><iframe src="add-item.html" title="Add item screen"></iframe></div></section>
    <section class="shot"><h2>Photo scan</h2><div class="device"><iframe src="scan.html" title="Photo scan screen"></iframe></div></section>
    <section class="shot"><h2>Recipes</h2><div class="device"><iframe src="recipes.html" title="Recipes screen"></iframe></div></section>
    <section class="shot"><h2>Recipe details</h2><div class="device"><iframe src="recipe-detail.html" title="Recipe details screen"></iframe></div></section>
    <section class="shot"><h2>Fridge organization</h2><div class="device"><iframe src="organize.html" title="Fridge organization screen"></iframe></div></section>
    <section class="shot"><h2>Profile & settings</h2><div class="device"><iframe src="profile.html" title="Profile screen"></iframe></div></section>
  </main>
</body>
</html>
